<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Little Bitty 销售台</title><link rel="stylesheet" href="style.css"><style>header{justify-content:flex-start}.wechat{display:flex;align-items:center;gap:12px;background:var(--accent);border:1px solid #d7dfb9;border-radius:12px;padding:10px 13px;margin-bottom:12px}.wechat span{font-weight:700;white-space:nowrap}.wechat input{width:100%;height:36px;border:0;border-radius:8px;padding:0 10px;background:#fff;outline:none}.product{padding:0;overflow:hidden}.product img{width:100%;height:180px;object-fit:cover;background:#eee}.productBody{padding:15px;display:grid;gap:11px}.productHead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.price{font-size:18px;color:var(--brand);font-weight:800;white-space:nowrap}.price del{display:block;font-size:11px;color:var(--muted);font-weight:400}.options{display:grid;grid-template-columns:1fr 1fr 70px;gap:7px}.options select,.options input{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;background:white;padding:0 9px}.reviewBtn{height:42px;border:0;border-radius:10px;background:var(--ink);color:white;font-weight:700}.confirmDialog{border:0;border-radius:18px;padding:0;width:min(92vw,390px);box-shadow:0 24px 90px #0004}.confirmDialog::backdrop{background:#20231dcc}.confirmDialog form{padding:24px}.confirmDialog h2{margin:6px 0 16px}.confirmDetail{background:var(--paper);border-radius:12px;padding:14px;margin-bottom:16px}.confirmDetail strong,.confirmDetail span{display:block}.confirmDetail strong{font-size:17px}.confirmActions{display:grid;grid-template-columns:1fr 1.5fr;gap:8px}.confirmActions button{height:44px;border-radius:10px;border:1px solid var(--line);background:white}.confirmActions .submit{background:var(--brand);color:white;border:0;font-weight:700}@media(max-width:760px){.product img{height:165px}.options{grid-template-columns:1fr 1fr 64px}}</style></head><body>
<header><div><span class="eyebrow">LITTLE BITTY · 亚宠展</span><h1>现场销售台</h1></div></header>
<style>.products{grid-template-columns:repeat(2,1fr)}.product{display:grid;grid-template-columns:132px 1fr;min-height:132px}.product img{width:132px;height:132px;align-self:start}.productBody{padding:12px;gap:8px}.productHead{display:block}.product h3{margin-bottom:3px}.price{font-size:16px;margin-top:5px}.price del{display:inline;margin-right:7px}.options{grid-template-columns:1fr 1fr 58px}.options select,.options input{height:36px;padding:0 7px}.reviewBtn{height:36px}.discounts{border:0;padding:0;margin:0 0 16px}.discounts legend{font-weight:700;margin-bottom:8px}.discountChoices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.discountChoices label{position:relative}.discountChoices input{position:absolute;opacity:0}.discountChoices span{display:block;text-align:center;padding:9px 4px;border:1px solid var(--line);border-radius:9px}.discountChoices input:checked+span{background:var(--accent);border-color:var(--brand);font-weight:700}.actualPay{font-size:18px;color:var(--brand);font-weight:800;margin-top:8px}@media(max-width:760px){.products{grid-template-columns:1fr}.product{grid-template-columns:112px 1fr}.product img{width:112px;height:112px}.productBody{padding:10px}.options{grid-template-columns:1fr 1fr 54px}}</style>
<style>.dateBar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:end;margin-bottom:12px}.dateBar label span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.dateBar input,.dateBar button{height:42px;border:1px solid var(--line);background:white;border-radius:10px;padding:0 12px}.dateBar input{width:100%}.staffTag{display:inline-block;margin-top:3px;padding:2px 7px;border-radius:99px;background:var(--accent);color:var(--brand);font-size:11px;font-weight:700}@media(max-width:520px){.dateBar{grid-template-columns:1fr 1fr}.dateBar label{grid-column:1/-1;grid-row:1}.dateBar button{grid-row:2}}</style>
<style>.dateBar{grid-template-columns:auto 1fr auto auto}.priceChoices{grid-template-columns:repeat(2,1fr)}.otherPrice{width:100%;height:40px;margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:0 10px}.otherPrice:disabled{display:none}.noteField{display:block;margin:-4px 0 16px;font-weight:700}.noteField textarea{display:block;width:100%;min-height:64px;margin-top:7px;border:1px solid var(--line);border-radius:9px;padding:9px;resize:vertical;font:inherit;font-weight:400}@media(max-width:520px){.dateBar{grid-template-columns:repeat(3,1fr)}.dateBar label{grid-column:1/-1}.dateBar button{grid-row:2}}</style>
<main>
  <nav><button class="tab active" data-page="sell">售货</button><button class="tab" data-page="dashboard">今日后台</button></nav>
  <section id="sell" class="page active">
    <label class="wechat"><span>售货员名字</span><input id="wechatName" maxlength="20" placeholder="填写你的名字" autocomplete="name"></label>
    <div id="products" class="products"><div class="empty">正在加载商品…</div></div>
  </section>
  <section id="dashboard" class="page">
    <div class="dateBar"><button id="previousDay">前一天</button><label><span>结算日期</span><input id="settlementDate" type="date"></label><button id="todayBtn">回到今天</button><button id="exportExcel">导出 Excel</button></div>
    <div class="stats"><article><span>售出件数</span><strong id="count">0</strong></article><article><span>实际收款</span><strong id="revenue">¥0</strong></article></div>
    <div class="panel"><h2>商品汇总</h2><div id="summary"></div></div>
    <div class="panel"><h2>售货员结算</h2><div id="staffSummary"></div></div>
    <div class="panel"><h2>销售记录</h2><div id="sales"></div></div>
  </section>
</main>
<dialog id="confirmSale" class="confirmDialog"><form method="dialog"><span class="eyebrow">请确认销售内容</span><h2>确认提交售出？</h2><div id="confirmDetail" class="confirmDetail"></div><fieldset class="discounts"><legend>成交单价</legend><div class="discountChoices priceChoices"><label><input type="radio" name="priceMode" value="standard" checked><span>展会价</span></label><label><input type="radio" name="priceMode" value="other"><span>其他价格</span></label></div><input id="otherPrice" class="otherPrice" type="number" min="0.01" max="100000" step="0.01" inputmode="decimal" placeholder="输入其他单价" disabled></fieldset><fieldset class="discounts"><legend>使用优惠</legend><div class="discountChoices"><label><input type="radio" name="discount" value="0" checked><span>0 元</span></label><label><input type="radio" name="discount" value="5"><span>5 元</span></label><label><input type="radio" name="discount" value="10"><span>10 元</span></label></div><div id="actualPay" class="actualPay"></div></fieldset><label class="noteField"><span>备注（选填）</span><textarea id="saleNote" maxlength="200" placeholder="例如：熟客价、轻微瑕疵"></textarea></label><div class="confirmActions"><button value="cancel" style="color:var(--ink)">返回修改</button><button id="submitSale" class="submit" value="default">确认提交</button></div></form></dialog>
<div id="toast" role="status"></div><script src="app.js"></script></body></html>
